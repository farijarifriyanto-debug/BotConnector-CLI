name: npm-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish"
        required: true
        default: "0.1.6"
        type: string
      reuse_run_id:
        description: "Optional prior npm-publish run ID whose verified artifacts should be reused"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          test "$(node -p "require('./npm-package/main/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/platform-linux-x64/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/platform-win32-x64/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/main/package.json').optionalDependencies['botconnector-cli-linux-x64']")" = "$V"
          test "$(node -p "require('./npm-package/main/package.json').optionalDependencies['botconnector-cli-win32-x64']")" = "$V"
          npm --version
      - name: Validate reused artifacts
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.reuse_run_id }}"
          OLD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')
          test -n "$OLD_SHA"
          BAD_FILES=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${OLD_SHA}...${GITHUB_SHA}" --jq '.files[].filename' | grep -v '^\.github/workflows/' || true)
          if [ -n "$BAD_FILES" ]; then
            echo "::error::Refusing to reuse artifacts because product files changed:"
            printf '%s\n' "$BAD_FILES"
            exit 1
          fi
          for NAME in npm-main npm-linux-x64 npm-win32-x64; do
            COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq "[.artifacts[] | select(.name == \"$NAME\" and .expired == false)] | length")
            test "$COUNT" = "1"
          done
          echo "Reuse run ${RUN_ID} verified: only workflow files changed and all npm artifacts are present."

  oidc-preflight:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify npm trusted-publisher OIDC exchange
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          verify_oidc() {
            local dir="$1"
            local pkg
            pkg=$(node -p "require('./${dir}/package.json').name")
            echo "::group::OIDC preflight ${pkg}"
            set +e
            out=$(npm publish "./${dir}" --dry-run --loglevel verbose 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out" | grep -E 'npm verbose oidc|npm http fetch|ENEEDAUTH|E404|trusted' || true
            if ! printf '%s\n' "$out" | grep -q 'Successfully retrieved and set token'; then
              echo "::error::OIDC exchange failed for ${pkg}"
              printf '%s\n' "$out" | tail -80
              echo "::endgroup::"
              return 1
            fi
            echo "OIDC exchange OK for ${pkg}"
            echo "::endgroup::"
            return 0
          }
          failures=0
          verify_oidc npm-package/main || failures=1
          verify_oidc npm-package/platform-linux-x64 || failures=1
          verify_oidc npm-package/platform-win32-x64 || failures=1
          exit "$failures"

  build-platform:
    needs: [preflight, oidc-preflight]
    if: ${{ inputs.reuse_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_dir: npm-package/platform-linux-x64
            artifact_name: npm-linux-x64
            binary_name: botconnector
          - os: windows-latest
            package_dir: npm-package/platform-win32-x64
            artifact_name: npm-win32-x64
            binary_name: botconnector.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
        run: bun run ./packages/opencode/script/build.ts --single --skip-embed-web-ui
      - name: Pack platform package
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=$(find packages/opencode/dist -maxdepth 3 -iname 'botconnector.exe' | head -1)
          else
            BIN=$(find packages/opencode/dist -maxdepth 3 -iname 'botconnector' -type f | head -1)
          fi
          test -n "$BIN"
          cp "$BIN" "${{ matrix.package_dir }}/${{ matrix.binary_name }}"
          chmod +x "${{ matrix.package_dir }}/${{ matrix.binary_name }}" || true
          mkdir -p out
          (cd "${{ matrix.package_dir }}" && npm pack --pack-destination ../../out)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  pack-main:
    needs: [preflight, oidc-preflight]
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Pack main package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          (cd npm-package/main && npm pack --pack-destination ../../out)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-main
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-platforms:
    needs: [oidc-preflight, build-platform, pack-main]
    if: ${{ always() && needs.oidc-preflight.result == 'success' && ((inputs.reuse_run_id != '') || (needs.build-platform.result == 'success' && needs.pack-main.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-linux-x64
          path: artifacts/linux
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-win32-x64
          path: artifacts/windows
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish platform packages with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          V="${{ inputs.version }}"
          publish_if_missing() {
            local pkg="$1"
            local file="$2"
            if npm view "${pkg}@${V}" version >/dev/null 2>&1; then
              echo "${pkg}@${V} already exists; skipping"
            else
              npm publish "$file" --access public --provenance
            fi
          }
          publish_if_missing "botconnector-cli-linux-x64" "$(find artifacts/linux -name '*.tgz' -type f | head -1)"
          publish_if_missing "botconnector-cli-win32-x64" "$(find artifacts/windows -name '*.tgz' -type f | head -1)"

  publish-main:
    needs: publish-platforms
    if: ${{ always() && needs.publish-platforms.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-main
          path: artifacts/main
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish botconnector-cli with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          V="${{ inputs.version }}"
          if npm view "botconnector-cli@${V}" version >/dev/null 2>&1; then
            echo "botconnector-cli@${V} already exists; skipping"
          else
            npm publish "$(find artifacts/main -name '*.tgz' -type f | head -1)" --access public --provenance
          fi
      - name: Verify registry release
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          for i in {1..12}; do
            MAIN=$(npm view "botconnector-cli@${V}" version 2>/dev/null || true)
            LINUX=$(npm view "botconnector-cli-linux-x64@${V}" version 2>/dev/null || true)
            WIN=$(npm view "botconnector-cli-win32-x64@${V}" version 2>/dev/null || true)
            if [ "$MAIN" = "$V" ] && [ "$LINUX" = "$V" ] && [ "$WIN" = "$V" ]; then
              echo "Published botconnector-cli@${V} and both platform packages."
              exit 0
            fi
            sleep 5
          done
          echo "Registry verification did not converge." >&2
          exit 1
