name: npm-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish"
        required: true
        default: "0.1.0-beta.5"
        type: string
      reuse_run_id:
        description: "Required successful npm-release-verify run ID from this exact main commit"
        required: true
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          test "$(node -p "require('./npm-package/main/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/platform-linux-x64/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/platform-win32-x64/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/main/package.json').optionalDependencies['bccli-linux-x64']")" = "$V"
          test "$(node -p "require('./npm-package/main/package.json').optionalDependencies['bccli-win32-x64']")" = "$V"
          npm --version
      - name: Refuse immutable npm version reuse
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          for PACKAGE in "@botconnector/bccli" "bccli-linux-x64" "bccli-win32-x64"; do
            if npm view "${PACKAGE}@${V}" version >/dev/null 2>&1; then
              echo "::error::${PACKAGE}@${V} already exists. npm versions are immutable; create a new release candidate instead."
              exit 1
            fi
          done
      - name: Enforce BotConnector self-audit release gate
        shell: bash
        run: node script/botconnector-release-audit.cjs
      - name: Require release artifacts and all test gates from exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.reuse_run_id }}"
          test -n "$RUN_ID" || { echo "::error::Release requires a successful npm-release-verify run ID"; exit 1; }
          RUN_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          OLD_SHA=$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')
          RUN_NAME=$(printf '%s' "$RUN_JSON" | jq -r '.name')
          CONCLUSION=$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')
          test "$RUN_NAME" = "npm-release-verify"
          test "$CONCLUSION" = "success"
          test "$OLD_SHA" = "$GITHUB_SHA"
          for NAME in npm-main npm-linux-x64 npm-win32-x64; do
            COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq "[.artifacts[] | select(.name == \"$NAME\" and .expired == false)] | length")
            test "$COUNT" = "1"
          done
          TEST_RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${GITHUB_SHA}&per_page=100")
          TEST_PASSED=$(printf '%s' "$TEST_RUNS" | jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")] | length')
          if [ "$TEST_PASSED" -lt 1 ]; then
            echo "::error::No successful complete test workflow exists for this exact main commit"
            exit 1
          fi
          echo "Verified: current main commit passed full test and npm-release-verify workflows; all platform artifacts present."

  oidc-preflight:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify GitHub OIDC prerequisites for npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::GitHub OIDC request URL unavailable"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "::error::GitHub OIDC request token unavailable"; exit 1; }
          # A dry-run does not prove that npm accepted a trusted publisher.
          # Request an actual short-lived, npm-audience GitHub OIDC token instead,
          # without publishing or disclosing the token.
          RESPONSE=$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          JWT=$(printf '%s' "$RESPONSE" | jq -er '.value')
          printf '%s' "$JWT" | node -e '
            let jwt = ""
            process.stdin.on("data", chunk => (jwt += chunk))
            process.stdin.on("end", () => {
              const body = jwt.split(".")[1]
              if (!body) throw new Error("Invalid GitHub OIDC token")
              const claims = JSON.parse(Buffer.from(body, "base64url").toString("utf8"))
              if (claims.iss !== "https://token.actions.githubusercontent.com") throw new Error("Unexpected OIDC issuer")
              if (claims.aud !== "npm:registry.npmjs.org") throw new Error("Unexpected npm audience")
              if (claims.repository !== process.env.GITHUB_REPOSITORY) throw new Error("Unexpected repository")
              if (claims.ref !== "refs/heads/main") throw new Error("OIDC token is not from main")
              console.log("GitHub OIDC token prerequisites PASS (npm registry acceptance is checked on actual publish)")
            })
          '
          npm --version

  build-platform:
    needs: [preflight, oidc-preflight]
    if: ${{ inputs.reuse_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_dir: npm-package/platform-linux-x64
            artifact_name: npm-linux-x64
            binary_name: bccli
          - os: windows-latest
            package_dir: npm-package/platform-win32-x64
            artifact_name: npm-win32-x64
            binary_name: bccli.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install
      - name: Build CLI
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
        run: bun run ./packages/botconnector/script/build.ts --single --skip-embed-web-ui
      - name: Pack platform package
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=$(find packages/botconnector/dist -maxdepth 3 -iname 'bccli.exe' | head -1)
          else
            BIN=$(find packages/botconnector/dist -maxdepth 3 -iname 'bccli' -type f | head -1)
          fi
          test -n "$BIN"
          cp "$BIN" "${{ matrix.package_dir }}/${{ matrix.binary_name }}"
          chmod +x "${{ matrix.package_dir }}/${{ matrix.binary_name }}" || true
          mkdir -p out
          (cd "${{ matrix.package_dir }}" && npm pack --pack-destination ../../out)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  pack-main:
    needs: [preflight, oidc-preflight]
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Pack main package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          (cd npm-package/main && npm pack --pack-destination ../../out)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-main
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-platforms:
    needs: [oidc-preflight, build-platform, pack-main]
    if: ${{ always() && needs.oidc-preflight.result == 'success' && ((inputs.reuse_run_id != '') || (needs.build-platform.result == 'success' && needs.pack-main.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-linux-x64
          path: artifacts/linux
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-win32-x64
          path: artifacts/windows
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish platform packages with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          V="${{ inputs.version }}"
          TAG="latest"
          if [[ "$V" == *-rc.* ]]; then
            TAG="rc"
          elif [[ "$V" == *-* ]]; then
            TAG="beta"
          fi
          publish_if_missing() {
            local pkg="$1"
            local file="$2"
            if npm view "${pkg}@${V}" version >/dev/null 2>&1; then
              echo "${pkg}@${V} already exists; skipping"
            else
              npm publish "$file" --access public --provenance --tag "$TAG"
            fi
          }
          publish_if_missing "bccli-linux-x64" "$(find artifacts/linux -name '*.tgz' -type f | head -1)"
          publish_if_missing "bccli-win32-x64" "$(find artifacts/windows -name '*.tgz' -type f | head -1)"

  publish-main:
    needs: publish-platforms
    if: ${{ always() && needs.publish-platforms.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-main
          path: artifacts/main
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish @botconnector/bccli with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          V="${{ inputs.version }}"
          TAG="latest"
          if [[ "$V" == *-rc.* ]]; then
            TAG="rc"
          elif [[ "$V" == *-* ]]; then
            TAG="beta"
          fi
          if npm view "@botconnector/bccli@${V}" version >/dev/null 2>&1; then
            echo "@botconnector/bccli@${V} already exists; skipping"
          else
            npm publish "$(find artifacts/main -name '*.tgz' -type f | head -1)" --access public --provenance --tag "$TAG"
          fi
      - name: Verify registry release
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          fresh_view() {
            local pkg="$1"
            local cache
            cache=$(mktemp -d)
            npm --cache "$cache" view "$pkg" version 2>/dev/null || true
            rm -rf "$cache"
          }
          for i in {1..36}; do
            MAIN=$(fresh_view "@botconnector/bccli@${V}")
            LINUX=$(fresh_view "bccli-linux-x64@${V}")
            WIN=$(fresh_view "bccli-win32-x64@${V}")
            if [ "$MAIN" = "$V" ] && [ "$LINUX" = "$V" ] && [ "$WIN" = "$V" ]; then
              echo "Published @botconnector/bccli@${V} and both platform packages."
              exit 0
            fi
            sleep 5
          done
          echo "Registry verification did not converge." >&2
          exit 1
