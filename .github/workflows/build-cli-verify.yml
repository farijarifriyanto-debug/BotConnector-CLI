name: build-cli-verify

on:
  workflow_dispatch:
  push:
    branches:
      - feat/botconnector-cache-stable-v015

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Deliberately using the DEFAULT (isolated) linker here, not --linker hoisted.
      # The repo's own setup-bun composite action forces --linker hoisted on Windows
      # as a workaround for a different, unrelated issue (patched peer variants —
      # see https://github.com/oven-sh/bun/issues/28147), but that hoisted layout
      # breaks resolution of @opentui/*'s subpath "exports" during the compile step
      # on Windows. The isolated linker (Bun's default) resolves them correctly.
      - name: Install dependencies (default linker)
        run: bun install

      - name: Build botconnector CLI (single target, skip web UI embed)
        run: bun run ./packages/botconnector/script/build.ts --single --skip-embed-web-ui

      - name: Find and run the compiled binary
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=$(find packages/botconnector/dist -maxdepth 3 -iname 'bccli.exe' | head -1)
          else
            BIN=$(find packages/botconnector/dist -maxdepth 3 -iname 'bccli' -type f | head -1)
          fi
          echo "Found binary: $BIN"
          test -n "$BIN"
          chmod +x "$BIN" || true
          "$BIN" --version
          "$BIN" --help
          mkdir -p artifact-out
          cp "$BIN" artifact-out/

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bccli-${{ matrix.os }}
          path: artifact-out/*
          if-no-files-found: error
          retention-days: 7
