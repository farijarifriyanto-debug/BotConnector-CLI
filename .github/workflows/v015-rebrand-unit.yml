name: v015 rebrand unit verify

on:
  push:
    branches:
      - fix/v015-rebrand-tests

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  core-unit:
    name: core unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Preinstall ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Configure git identity
        run: |
          git config --global user.email "bot@botconnector.id"
          git config --global user.name "BotConnector CI"

      - name: Run core unit tests
        working-directory: packages/core
        run: bun run test
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
