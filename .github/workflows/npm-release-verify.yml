name: npm-release-verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to verify"
        required: true
        default: "0.1.7"
        type: string

jobs:
  verify-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify npm package versions
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          test "$(node -p "require('./npm-package/main/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/platform-linux-x64/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/platform-win32-x64/package.json').version")" = "$V"
          test "$(node -p "require('./npm-package/main/package.json').optionalDependencies['botconnector-cli-linux-x64']")" = "$V"
          test "$(node -p "require('./npm-package/main/package.json').optionalDependencies['botconnector-cli-win32-x64']")" = "$V"
          node - <<'NODE'
          const fs = require("fs")
          const cfg = JSON.parse(fs.readFileSync("npm-package/main/default-config/botconnector-cloud.jsonc", "utf8"))
          const gateway = cfg.provider?.botconnector
          if (gateway?.name !== "BotConnector Gateway") throw new Error("BotConnector Gateway name missing")
          if (gateway?.options?.baseURL !== "https://api.botconnector.id/v1") throw new Error("BotConnector Gateway URL mismatch")
          if (gateway?.options?.apiKey !== undefined) throw new Error("Bundled config must not hard-code apiKey")
          if (!Array.isArray(gateway?.env) || !gateway.env.includes("BOTCONNECTOR_API_KEY")) {
            throw new Error("BOTCONNECTOR_API_KEY env fallback missing")
          }
          NODE

  pack-main:
    needs: verify-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Pack main npm package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          (cd npm-package/main && npm pack --pack-destination ../../out)
          npm pack --dry-run ./npm-package/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-main
          path: out/*.tgz
          if-no-files-found: error

  pack-platform:
    needs: verify-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_dir: npm-package/platform-linux-x64
            artifact_name: npm-linux-x64
            binary_name: botconnector
          - os: windows-latest
            package_dir: npm-package/platform-win32-x64
            artifact_name: npm-win32-x64
            binary_name: botconnector.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install
      - name: Build CLI for npm platform package
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
        run: bun run ./packages/opencode/script/build.ts --single --skip-embed-web-ui
      - name: Stage and pack platform package
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=$(find packages/opencode/dist -maxdepth 3 -iname 'botconnector.exe' | head -1)
          else
            BIN=$(find packages/opencode/dist -maxdepth 3 -iname 'botconnector' -type f | head -1)
          fi
          test -n "$BIN"
          cp "$BIN" "${{ matrix.package_dir }}/${{ matrix.binary_name }}"
          chmod +x "${{ matrix.package_dir }}/${{ matrix.binary_name }}" || true
          mkdir -p out
          (cd "${{ matrix.package_dir }}" && npm pack --pack-destination ../../out)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: out/*.tgz
          if-no-files-found: error

  install-smoke:
    needs: [pack-main, pack-platform]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_artifact: npm-linux-x64
          - os: windows-latest
            platform_artifact: npm-win32-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-main
          path: artifacts/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.platform_artifact }}
          path: artifacts/platform
      - name: Install packed npm packages and run npx
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          cd smoke
          npm init -y >/dev/null
          npm install --ignore-scripts ../artifacts/platform/*.tgz ../artifacts/main/*.tgz

          # Simulate an existing v0.1.5 install so the npm launcher must
          # migrate the old generated gateway config before starting.
          RAW_HOME="$PWD/migration-home"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TEST_HOME=$(cygpath -w "$RAW_HOME")
          else
            TEST_HOME="$RAW_HOME"
          fi
          export HOME="$TEST_HOME"
          export USERPROFILE="$TEST_HOME"
          export BOTCONNECTOR_MIGRATION_TEST_HOME="$TEST_HOME"

          node - <<'NODE'
          const fs = require("fs")
          const path = require("path")
          const home = process.env.BOTCONNECTOR_MIGRATION_TEST_HOME
          const dir = path.join(home, ".config", "botconnector")
          fs.mkdirSync(dir, { recursive: true })
          fs.writeFileSync(
            path.join(dir, "botconnector-cloud.jsonc"),
            JSON.stringify({
              provider: {
                botconnector: {
                  npm: "@ai-sdk/openai-compatible",
                  name: "BotConnector Cloud",
                  options: {
                    baseURL: "https://api.botconnector.id/v1",
                    apiKey: "{env:BOTCONNECTOR_API_KEY}"
                  },
                  models: {}
                }
              }
            }, null, 2) + "\n"
          )
          NODE

          test "$(npx --no-install botconnector --version)" = "${{ inputs.version }}"

          node - <<'NODE'
          const fs = require("fs")
          const path = require("path")
          const home = process.env.BOTCONNECTOR_MIGRATION_TEST_HOME
          const cfg = JSON.parse(fs.readFileSync(path.join(home, ".config", "botconnector", "botconnector-cloud.jsonc"), "utf8"))
          const gateway = cfg.provider.botconnector
          if (gateway.name !== "BotConnector Gateway") throw new Error("legacy gateway name was not migrated")
          if (gateway.options.apiKey !== undefined) throw new Error("legacy apiKey placeholder was not removed")
          if (!gateway.env?.includes("BOTCONNECTOR_API_KEY")) throw new Error("gateway env fallback was not migrated")
          NODE
