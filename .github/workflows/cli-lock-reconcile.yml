name: cli-lock-reconcile
on:
  push:
    branches:
      - cli-e2e-repair
    paths:
      - .github/workflows/cli-lock-reconcile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Regenerate committed lockfile from current workspace
        shell: bash
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          git diff --check
          changed=$(git diff --name-only)
          if [ "$changed" != "bun.lock" ]; then
            echo "::error::Unexpected dirty files: $changed"
            exit 1
          fi
          git config user.name "botconnector-ci"
          git config user.email "botconnector-ci@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "fix(deps): reconcile Bun lockfile after CLI package migration"
          git push origin HEAD:cli-e2e-repair
